name: CI Pipeline

on:
  push:
    branches: [ "main", "deeksha/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-and-security-tests:
    name: Backend & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Pytest Suite
        env:
          PORT: 8000
          HOST: 127.0.0.1
          SECURITY_POLICY_MODE: strict
        run: |
          pytest -v

  extension-and-frontend-checks:
    name: Extension & Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Validate Extension JavaScript Syntax
        run: |
          node -c chrome_extension/background.js
          node -c chrome_extension/content.js

      - name: Validate Extension Manifest Permissions
        run: |
          python -c "
          import json
          with open('chrome_extension/manifest.json') as f:
              m = json.load(f)
          perms = m.get('permissions', [])
          assert 'cookies' not in perms, 'CRITICAL: Chrome cookies permission must not be in extension manifest'
          assert m.get('manifest_version') == 3, 'Must be Manifest V3'
          print('Manifest verification PASSED: No cookies permission, valid Manifest V3')
          "

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

