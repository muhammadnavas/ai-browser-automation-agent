name: Multi-agent tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/full-multi-agent-collaboration
  pull_request:
    branches:
      - main

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run orchestration and safety tests
        run: >-
          pytest -q
          tests/test_action_safety.py
          tests/test_llm_delegation.py
          tests/test_subagent_memory.py
          tests/test_specialist_workers.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
